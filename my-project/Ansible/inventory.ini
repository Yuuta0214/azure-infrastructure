# ==========================================
# Azure VM Inventory Configuration
# ==========================================

[azure_vms]
# 【重要】ホスト名のみ定義。IP(ansible_host)は Actions の実行引数で注入することで
# INIファイルのパースエラーを物理的に回避します。
target_vm

[azure_vms:vars]
# 1. 基本接続設定
ansible_python_interpreter=/usr/bin/python3
# 実行ユーザーも外部から注入
ansible_user={{ admin_username }}

# 2. 認証設定
# GitHub Actions環境のパスを指定
ansible_ssh_private_key_file=~/.ssh/id_rsa

# 3. SSH 接続オプション (ベストプラクティス)
# 接続の再利用と、クラウド起動直後を考慮したリトライ設定。
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=60 -o ConnectionAttempts=10 -o ControlMaster=auto -o ControlPersist=60s'

# 4. パイプライニングの有効化
# SSH通信回数を削減し、デプロイ速度を最大化。
ansible_ssh_pipelining=True