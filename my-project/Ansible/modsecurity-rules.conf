# ModSecurityのメイン設定を読み込む
Include /etc/nginx/modsec/modsecurity.conf

# OWASP CRS を有効化する場合の記述例
# OWASP CRS を正しく読み込む
Include /etc/modsecurity/crs/crs-setup.conf
Include /etc/modsecurity/crs/rules/*.conf

# 必要に応じて、ルールセットをここにIncludeしていく（現在は最低限の設定）
# SecRule ARGS "test" "id:100,deny,status:403,msg:'Test Rule'"
# テスト用ルール（検証用）
SecRule ARGS "test" "id:100,deny,status:403,msg:'Test Rule triggered by IaC'"