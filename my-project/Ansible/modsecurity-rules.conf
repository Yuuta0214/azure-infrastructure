# 1. ベース設定
Include /etc/nginx/modsec/modsecurity.conf

# 2. ログとバッファの最適化
SecRuleEngine On
SecAuditLogType Serial
SecAuditLog /var/log/modsec_audit.log
SecResponseBodyAccess Off
SecResponseBodyMimeType None

# 3. テスト用ルール
SecRule ARGS "test" "id:100,deny,status:403,msg:'Test Rule triggered by IaC'"

# 4. 【重要】crs-setup.confをIncludeせず、必要な設定のみを記述（重複排除）
# ここで SecDefaultAction を一度だけ定義する
SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"

# 5. ルール本体の読み込み
Include /etc/nginx/modsec/rules/REQUEST-901-INITIALIZATION.conf
Include /etc/nginx/modsec/rules/REQUEST-91*.conf
Include /etc/nginx/modsec/rules/REQUEST-92*.conf
Include /etc/nginx/modsec/rules/REQUEST-93*.conf
Include /etc/nginx/modsec/rules/REQUEST-94*.conf