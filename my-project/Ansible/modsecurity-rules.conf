# 1. ベース設定
Include /etc/nginx/modsec/modsecurity.conf

# 2. 【500エラー解消の要】エンジンを「検知のみ」に変更
# これにより、ルールに合致しても遮断(Deny)処理が走らなくなるため、500エラーが起きなくなります
SecRuleEngine DetectionOnly

SecAuditLogType Serial
SecAuditLog /var/log/modsec_audit.log
SecResponseBodyAccess Off

# 3. テスト用ルール（検知のみ動作するよう設定）
# deny を pass に変更し、ルールが発動したことをログに残す設定にします
SecRule ARGS "test" "id:100,pass,log,msg:'Test Rule triggered',tag:'WAF_TEST'"

# 4. ルール読み込み（Debian の modsecurity-crs パッケージ配置に合わせる）
Include /etc/nginx/modsec/crs-setup.conf
Include /etc/modsecurity/crs/rules/REQUEST-901-INITIALIZATION.conf
Include /etc/modsecurity/crs/rules/REQUEST-91*.conf