# 1. ベース設定の取り込み
Include /etc/nginx/modsec/modsecurity.conf

# 2. 【500エラー根本解決】ログモードとバッファ制限の最適化
SecRuleEngine On
SecAuditLogType Serial
SecAuditLog /var/log/modsec_audit.log

SecRequestBodyLimit 14107200
SecRequestBodyNoFilesLimit 11048576
SecResponseBodyLimit 10524288
SecRequestBodyLimitAction ProcessPartial

# 3. テスト用ルール（検証用：これは残します）
SecRule ARGS "test" "id:100,deny,status:403,msg:'Test Rule triggered by IaC'"

# 4. 【500エラー根本解決】OWASP CRS の読み込み順序をここで完全に強制する
Include /etc/nginx/modsec/crs-setup.conf
Include /etc/nginx/modsec/rules/REQUEST-901-INITIALIZATION.conf
Include /etc/nginx/modsec/rules/*.conf