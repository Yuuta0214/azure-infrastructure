# 1. ベース設定の取り込み
Include /etc/nginx/modsec/modsecurity.conf

# 2. ログモードとバッファ制限の最適化
SecRuleEngine On
SecAuditLogType Serial
SecAuditLog /var/log/modsec_audit.log

SecRequestBodyLimit 14107200
SecRequestBodyNoFilesLimit 11048576
SecResponseBodyLimit 10524288
SecRequestBodyLimitAction ProcessPartial

# 3. 【バグ完全回避】deny の代わりに「変数をセットするだけ」にする
# リクエストに "test" が含まれていたら、WAF_BLOCKED という環境変数を 1 にする
SecRule ARGS "test" "id:100,pass,log,msg:'Test Rule triggered',setenv:WAF_BLOCKED=1"

# 4. OWASP CRS の正しいロード順序（重複回避版）
Include /etc/nginx/modsec/crs-setup.conf
Include /etc/nginx/modsec/rules/REQUEST-901-INITIALIZATION.conf
Include /etc/nginx/modsec/rules/REQUEST-905-*.conf
Include /etc/nginx/modsec/rules/REQUEST-91*.conf
Include /etc/nginx/modsec/rules/REQUEST-92*.conf
Include /etc/nginx/modsec/rules/REQUEST-93*.conf
Include /etc/nginx/modsec/rules/REQUEST-94*.conf
Include /etc/nginx/modsec/rules/RESPONSE-999-*.conf