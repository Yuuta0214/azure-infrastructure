##########################################################################
# Azure Infrastructure Build Workflow (Bastionトンネル対応・完成版)
##########################################################################
name: '02-compute-Deploy'

on:
  workflow_dispatch: # 手動実行

permissions:
  contents: read
  id-token: write

jobs:
  # =============================================================
  # 5. Plan & Check (02_compute 層)
  # =============================================================
  terraform-plan-compute:
    name: '5. Plan & Check (02_compute)'
    runs-on: ubuntu-latest
    # Terraform実行に必要なAzure認証情報を環境変数としてセット
    env:
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
      # 02_compute層で必要な変数を環境変数としてセット（例: 管理者ユーザー名、パスワード、SSH公開鍵など）
      TARGET_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
      TF_VAR_admin_username: ${{ secrets.TF_VAR_ADMIN_USERNAME }}
      TF_VAR_admin_password: ${{ secrets.TF_VAR_ADMIN_PASSWORD }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_resource_group_name: "rg-web-${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}"
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
    steps:
      # コードのチェックアウト - GitHub Actionsのワークスペースにリポジトリコードを取得
      - name: 5-1, Checkout Code
        uses: actions/checkout@v4

      # Azure Login (OIDC) - GitHub ActionsのOIDCトークンを使用してAzureにログイン
      - name: 5-2, Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Terraform(ver 1.7.0) install Setup
      - name: 5-3, Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      # Terraform Init - Terraform実行前の初期化
      - name: 5-4, Terraform Init
        run: |
          terraform init \
            -backend-config=../../shared/config/backend/${{ env.TARGET_ENV }}.backend.hcl \
            -backend-config="key=compute.tfstate"
        working-directory: ./infrastructure/02_compute

      # Terraform Plan - 変更内容を確認するためのプランニング。tfvarsファイルとプロジェクト名を変数として渡す。
      - name: 5-5, Terraform Plan
        run: terraform plan -var-file="env-${{ env.TARGET_ENV }}.tfvars" -out=tfplan-compute
        working-directory: ./infrastructure/02_compute

      # 2回目以降の冪等性を守るため、プラン結果(5-5)を一時保存
      - name: 5-6, Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-compute-artifacts
          path: ./infrastructure/02_compute/tfplan-compute

  # =============================================================
  # 6. Apply & Deploy (02_compute 層)
  # =============================================================
  terraform-apply-compute:
    name: '6. Apply & Deploy (02_compute)'
    needs: terraform-plan-compute
    environment: 'production' 
    runs-on: ubuntu-latest
    # Terraform実行に必要なAzure認証情報を環境変数としてセット
    env:
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
      # 02_compute層で必要な変数を環境変数としてセット（例: 管理者ユーザー名、パスワード、SSH公開鍵など）
      TARGET_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
      TF_VAR_admin_username: ${{ secrets.TF_VAR_ADMIN_USERNAME }}
      TF_VAR_admin_password: ${{ secrets.TF_VAR_ADMIN_PASSWORD }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_resource_group_name: "rg-web-${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}"
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      # コードのチェックアウト - GitHub Actionsのワークスペースにリポジトリコードを取得
      - name: 6-1, Checkout Code
        uses: actions/checkout@v4
      
      # Azure CLIのキャッシュをクリアして、クリーンな状態でAzure Loginを行う
      - name: 6-2, Clear Azure CLI cache
        run: az account clear

      # Azure Login (OIDC) - GitHub ActionsのOIDCトークンを使用してAzureにログイン
      - name: 6-3, Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Azure CLIでアクティブなサブスクリプションを設定
      - name: 6-4, Set Active Subscription
        run: az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Azure CLIで現在のセッション情報をデバッグ出力（サブスクリプションIDやアカウント情報など）
      - name: 6-5, Debug Azure Session
        run: |
          echo "Active Account Info:"
          az account show --output json
          echo "Available Subscriptions:"
          az account list --output table

      # 2回目以降の冪等性を守るため、5-6で保存したプラン結果をダウンロードして復元
      - name: 6-6, Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-compute-artifacts
          path: ./infrastructure/02_compute

      # Terraform(ver 1.7.0) install Setup
      - name: 6-7, Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      # Terraform Init - Terraform実行前の初期化
      - name: 6-8, Terraform Init
        run: |
          terraform init \
            -backend-config=../../shared/config/backend/${{ env.TARGET_ENV }}.backend.hcl \
            -backend-config="key=compute.tfstate"
        working-directory: ./infrastructure/02_compute

      # Terraform Apply - 6-6でダウンロードしたプランを適用してインフラをデプロイ
      - name: 6-9, Terraform Apply
        run: terraform apply -auto-approve tfplan-compute
        working-directory: ./infrastructure/02_compute

      # もともとの「Get LB Public IP」の枠組みの中で、Bastionトンネルを安全に起動させます
      - name: 6-10, Get LB Public IP
        run: |
          echo "Configuring Azure CLI..."
          az config set extension.use_dynamic_install=yes_without_prompt --local
          
          echo "Starting Azure Bastion Tunnel..."
          az network bastion tunnel \
            --name "bastion-web-${{ env.TARGET_ENV }}" \
            --resource-group "rg-web-${{ env.TARGET_ENV }}" \
            --target-resource-id "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/rg-web-${{ env.TARGET_ENV }}/providers/Microsoft.Compute/virtualMachines/vm-web-${{ env.TARGET_ENV }}" \
            --resource-port 22 \
            --port 50022 &
          
          echo "Waiting for tunnel port 50022..."
          for i in {1..30}; do
            if nc -z 127.0.0.1 50022; then
              echo "Tunnel established successfully."
              exit 0
            fi
            sleep 2
          done
          echo "Timeout: Failed to open tunnel."
          exit 1
        working-directory: ./infrastructure/02_compute

      - name: 6-11, Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # 変数のみをローカルループバック（127.0.0.1）に修正
      - name: 6-12, Run Ansible Playbook via LB NAT
        run: |
          ansible-playbook -i inventory.ini deploy-components.yml \
            -u ${{ secrets.TF_VAR_ADMIN_USERNAME }} \
            --extra-vars "ansible_host=127.0.0.1 \
                          ansible_port=50022 \
                          admin_username=${{ secrets.TF_VAR_ADMIN_USERNAME }} \
                          mysql_root_password=rootpassword \
                          mysql_db_name=web_db \
                          mysql_user=dbuser \
                          mysql_password=mypassword"
        working-directory: ./config-management

      - name: 6-13, Cleanup Tunnel
        if: always()
        # || true を追加することで、pkill が失敗（プロセスなし）しても終了コード 0 を返します
        run: pkill -f "az network bastion tunnel" || true
