##########################################################################
# Azure Infrastructure Build Workflow (お手本準拠・安全設計版)
##########################################################################
# 目的: 01_network のデプロイ
# 特徴: OIDC認証、Artifactによるプラン確認
##########################################################################
name: '01-network-Deploy'

on:
  workflow_dispatch: # 手動実行のみ

permissions:
  contents: read
  id-token: write

jobs:
  # ※ ユーザー様の意図に基づき、terraform-plan-backend および terraform-apply-backend は
  # infra-01-network.yml からは除外し、networkのJobのみを維持します。

  # =============================================================
  # 3. Plan & Check (01_network 層)
  # =============================================================
  terraform-plan-network:
    name: '3. Plan & Check (01_network)'
    runs-on: ubuntu-latest
    # Terraform実行に必要なAzure認証情報を環境変数としてセット
    env:
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      TARGET_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
      ARM_USE_OIDC: true

    steps:
      # コードのチェックアウト - GitHub Actionsのワークスペースにリポジトリコードを取得
      - name: 3-1, Checkout Code
        uses: actions/checkout@v4

      # Azure Login (OIDC) - GitHub ActionsのOIDCトークンを使用してAzureにログイン
      - name: 3-2, Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Terraform(ver 1.7.0) install Setup
      - name: 3-3, Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      # Terraform Init - Terraform実行前の初期化
      - name: 3-4, Terraform Init
        id: init
        working-directory: ./infrastructure/01_network
        run: |
          terraform init \
            -backend-config=../../shared/config/backend/${{ env.TARGET_ENV }}.backend.hcl \
            -backend-config="key=network.tfstate"
       
      # Terraform Plan - 変更内容を確認するためのプランニング。tfvarsファイルとプロジェクト名を変数として渡す。
      - name: 3-5, Terraform Plan
        id: plan
        working-directory: ./infrastructure/01_network
        # セキュリティと整合性のため、shared/config/env の共通変数ファイルを参照します
        run: terraform plan -var-file="../../shared/config/env/${{ env.TARGET_ENV }}.tfvars" -out=tfplan
        
      # 2回目以降の冪等性を守るため、プラン結果(3-5)を一時保存
      - name: 3-6, Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-network-artifacts
          path: ./infrastructure/01_network/tfplan

  # =============================================================
  # 4. Apply & Deploy (01_network 層)
  # =============================================================
  terraform-apply-network:
    name: '4. Apply & Deploy (01_network)'
    needs: terraform-plan-network
    environment: 'production'
    runs-on: ubuntu-latest
    # Terraform実行に必要なAzure認証情報を環境変数としてセット
    env:
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      TARGET_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
      ARM_USE_OIDC: true

    steps:
      # コードのチェックアウト - GitHub Actionsのワークスペースにリポジトリコードを取得
      - name: 4-1, Checkout Code
        uses: actions/checkout@v4

      # Azure Login (OIDC) - GitHub ActionsのOIDCトークンを使用してAzureにログイン
      - name: 4-2, Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 2回目以降の冪等性を守るため、3-6で保存したプラン結果をダウンロードして復元
      - name: 4-3, Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-network-artifacts
          path: ./infrastructure/01_network

      # Terraform(ver 1.7.0) install Setup
      - name: 4-4, Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      # Terraform Init - Terraform実行前の初期化
      - name: 4-5, Terraform Init
        working-directory: ./infrastructure/01_network
        run: |
          terraform init \
            -backend-config=../../shared/config/backend/${{ env.TARGET_ENV }}.backend.hcl \
            -backend-config="key=network.tfstate"
       
      # Terraform Apply - 2-3でダウンロードしたプランを適用してインフラをデプロイ
      - name: 4-6, Terraform Apply
        working-directory: ./infrastructure/01_network
        run: terraform apply -auto-approve tfplan
        
