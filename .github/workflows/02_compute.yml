##########################################################################
# Azure Infrastructure Build Workflow (修正版)
##########################################################################
name: '02-compute-Deploy'

on:
  workflow_dispatch: # 手動実行

permissions:
  contents: read
  id-token: write

jobs:
  # =============================================================
  # 5. Plan & Check (02_compute 層)
  # =============================================================
  terraform-plan-compute:
    name: '5. Plan & Check (02_compute)'
    runs-on: ubuntu-latest
    env:
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
      TARGET_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
      TF_VAR_admin_username: ${{ secrets.TF_VAR_ADMIN_USERNAME }}
      TF_VAR_admin_password: ${{ secrets.TF_VAR_ADMIN_PASSWORD }}
      # ↓ 【追加】SSH公開鍵をSecretsからTerraform変数へ注入
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_resource_group_name: "rg-web-${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}"
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
    steps:
      - name: 5-1, Checkout Code
        uses: actions/checkout@v4

      - name: 5-2, Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 5-3, Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: 5-4, Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=rg-web-dev-mgmt" \
            -backend-config="storage_account_name=stwebdevbackend" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=compute.tfstate"
        working-directory: ./my-project/02_compute

      - name: 5-5, Terraform Plan
        run: terraform plan -var-file="env-${{ env.TARGET_ENV }}.tfvars" -out=tfplan-compute
        working-directory: ./my-project/02_compute

      - name: 5-6, Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-compute-artifacts
          path: ./my-project/02_compute/tfplan-compute

  # =============================================================
  # 6. Apply & Deploy (02_compute 層)
  # =============================================================
  terraform-apply-compute:
    name: '6. Apply & Deploy (02_compute)'
    needs: terraform-plan-compute
    environment: 'production' 
    runs-on: ubuntu-latest
    env:
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
      TARGET_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
      TF_VAR_admin_username: ${{ secrets.TF_VAR_ADMIN_USERNAME }}
      TF_VAR_admin_password: ${{ secrets.TF_VAR_ADMIN_PASSWORD }}
      # ↓ 【追加】Apply時にも同様に注入
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_resource_group_name: "rg-web-${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}"
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: 6-1, Checkout Code
        uses: actions/checkout@v4

      - name: 6-2, Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 6-3, Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-compute-artifacts
          path: ./my-project/02_compute

      - name: 6-4, Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: 6-5, Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=rg-web-dev-mgmt" \
            -backend-config="storage_account_name=stwebdevbackend" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=compute.tfstate"
        working-directory: ./my-project/02_compute

      # 6-6, Terraform Apply (compute層のVM作成)
      - name: 6-6, Terraform Apply
        run: terraform apply -auto-approve tfplan-compute
        working-directory: ./my-project/02_compute

      # 6-7, Ansible用の接続先IPを固定値でセット
      # network層の出力を参照しに行かず、ここで完結させます
      - name: 6-7, Get Public IP
        id: get_ip
        run: |
          # compute層の実行結果（data source経由）から最新IPを取得
          PUBLIC_IP=$(terraform output -raw public_ip_address)
          echo "target_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
        working-directory: ./my-project/02_compute

      # 6-8, SSH秘密鍵のセットアップ
      - name: 6-8, Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # 6-9, Ansibleの実行
      - name: 6-9, Run Ansible Playbook
        run: |
          ansible-playbook -i inventory.ini site.yml \
            --extra-vars "target_ip=${{ steps.get_ip.outputs.target_ip }} admin_username=${{ secrets.TF_VAR_ADMIN_USERNAME }}"
        working-directory: ./my-project/Ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'