# 1. ベース設定
Include /etc/nginx/modsec/modsecurity.conf

# 2. CRS ルールの読み込み (Debian 標準パスに統一)
Include /usr/share/modsecurity-crs/crs-setup.conf
Include /usr/share/modsecurity-crs/rules/REQUEST-901-INITIALIZATION.conf
Include /usr/share/modsecurity-crs/rules/REQUEST-91*.conf

# 3. エンジン設定
SecRuleEngine DetectionOnly
SecAuditLogType Serial
SecAuditLog /var/log/modsec_audit.log
SecResponseBodyAccess Off

# 4. テスト用ルール
SecRule ARGS "test" "id:100,pass,log,msg:'Test Rule triggered',tag:'WAF_TEST'"