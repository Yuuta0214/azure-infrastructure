- name: "Component-based Deployment of Web Service"
  hosts: all
  gather_facts: yes
  become: yes

  vars:
    admin_user: "{{ admin_username }}"
    project_root: "/home/{{ admin_username }}/app"

  tasks:
    # ------------------------------------------
    # 1. VM基盤およびミドルウェア構築
    # ------------------------------------------
    - name: "Update and install base system packages"
      ansible.builtin.apt:
        name: [chrony, locales, nginx, libmodsecurity3, libnginx-mod-http-modsecurity, modsecurity-crs, certbot, python3-certbot-nginx]
        state: present
        update_cache: yes

    - name: "Set Timezone"
      community.general.timezone:
        name: Asia/Tokyo

    - name: "Set Locale"
      community.general.locale_gen:
        name: ja_JP.UTF-8
        state: present

    - name: "Wait for infrastructure bootstrap"
      ansible.builtin.wait_for: { path: /var/tmp/bootstrap_complete, timeout: 600 }
      become: no
      
    # ------------------------------------------
    # 2. Docker 環境構築
    # ------------------------------------------
    - name: "Add Docker's official GPG key"
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/debian/gpg"
        dest: "/etc/apt/keyrings/docker.asc"
        mode: '0644'

    - name: "Add Docker repository"
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
        state: present

    - name: "Install Docker Engine and Compose plugin"
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        state: present

    - name: "Ensure Docker service is started"
      ansible.builtin.systemd: { name: docker, state: started, enabled: yes }
      
    # ------------------------------------------
    # 3. ネットワーク先行構築
    # ------------------------------------------
    - name: "Ensure shared docker networks exist"
      community.docker.docker_network:
        name: "{{ item }}"
        state: present
      loop: [frontend-nw, backend-nw]

    # ------------------------------------------
    # 4. アプリケーション層 (Docker構成配置)
    # ------------------------------------------
    - name: "Create component directories"
      ansible.builtin.file:
        path: "{{ project_root }}/components/{{ item }}"
        state: directory
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: '0755'
      loop: [db, app, web]

    - name: "Copy web static assets"
      ansible.builtin.copy:
        src: "./html"
        dest: "{{ project_root }}/components/web/"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: '0755'

    - name: "Deploy docker-compose files"
      ansible.builtin.template:
        src: "./components/{{ item.src }}/{{ item.file }}.j2"
        dest: "{{ project_root }}/components/{{ item.src }}/docker-compose.yml"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: '0644'
      loop:
        - { src: "db", file: "docker-compose-db.yml" }
        - { src: "app", file: "docker-compose-app.yml" }
        - { src: "web", file: "docker-compose-web.yml" }

    - name: "Deploy nginx-container.conf"
      ansible.builtin.copy:
        src: "nginx-container.conf"
        dest: "{{ project_root }}/components/web/nginx-container.conf"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: '0644'

    - name: "Create a test index for App container"
      ansible.builtin.copy:
        content: "Hello from Python App API"
        dest: "{{ project_root }}/components/app/index.html"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: '0644'

    # ------------------------------------------
    # 5. コンテナ起動 (修正案)
    # ------------------------------------------
    - name: "Start Docker containers"
      ansible.builtin.shell: |
        cd {{ project_root }}/components && \
        docker compose -f db/docker-compose.yml -f app/docker-compose.yml -f web/docker-compose.yml -p myapp up -d --remove-orphans

    - name: "Wait for web service to be responsive"
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080"
        status_code: 200
      register: result
      until: result.status == 200
      retries: 5
      delay: 5

    # ------------------------------------------
    # 6. ホスト Nginx 設定 (修正案)
    # ------------------------------------------
    - name: "Configure Host Nginx"
      ansible.builtin.template:
        src: "./nginx-host.conf.j2"
        dest: "/etc/nginx/sites-available/default"
      notify: Restart Nginx

    - name: "Enable host Nginx configuration"
      ansible.builtin.file:
        src: "/etc/nginx/sites-available/default"
        dest: "/etc/nginx/sites-enabled/default"
        state: link

    - name: "Finalize Nginx"
      ansible.builtin.command: nginx -t
      changed_when: false

  handlers:
    - name: Restart Nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted 