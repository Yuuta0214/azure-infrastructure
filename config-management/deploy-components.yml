# docker-compose-web.yml.j2 の修正
web_compose = """services:
  web:
    image: nginx:stable-alpine
    container_name: nginx-web
    restart: unless-stopped
    user: "0:0"
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8080:80"
    volumes:
      - ./nginx-container.conf:/etc/nginx/conf.d/default.conf:ro
      - ./html:/usr/share/nginx/html:ro
    networks:
      - frontend-nw

networks:
  frontend-nw:
    external: true
"""
default_api.create_new_file(filepath="config-management/components/web/docker-compose-web.yml.j2", contents=web_compose)

