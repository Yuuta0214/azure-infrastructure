# ==========================================
# Azure VM Inventory Configuration
# ==========================================

[azure_vms]
# IPアドレスは実行時にコマンドラインオプションで注入するため、ここではホスト名のみ定義
target_vm

[azure_vms:vars]
# 1. 基本接続設定
ansible_python_interpreter=/usr/bin/python3

# 2. 認証設定
ansible_ssh_private_key_file=~/.ssh/id_rsa

# 3. SSH 接続オプション
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=60 -o ConnectionAttempts=10 -o ControlMaster=auto -o ControlPersist=600s'

# 4. パイプライニングの有効化
ansible_ssh_pipelining=True